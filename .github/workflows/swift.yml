name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build-ubuntu-latest:
    name: Swift ${{ matrix.swift }} on ubuntu-22.04
    strategy:
      matrix:
        # Tea requires Swift 5.9 or later on Linux.
        swift: ["5.9", "5.10"]
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  build-macos-latest:
    name: Swift (Xcode ${{ matrix.xcode }}) on ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: macos-15
          xcode: "16.4"
        - os: macos-26
          xcode: "26.6"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Use the Swift compiler and SDK bundled with the same Xcode.
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
    - uses: actions/checkout@v4
    - name: Verify toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
